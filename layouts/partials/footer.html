<!--Footer-->
<footer class="page-footer center" style="background-image: url('{{ .Site.Params.contactImg | absURL }}');">
    {{ with .Site.GetPage "/about/contact-us" }}
    <div class="footer-contact container-fluid">
        <div class="container">
            <div class="row text-center grid-2-top grid-1-bottom">
                <h1 class="title">{{ .Title }}</h1>
            </div>
            <div class="oswald">
                {{ .Content }}
            </div>
        </div>
    </div>
    {{ end }}
    <div style="background-color:#0a2f42; text-align:center; padding:10px 15px;">
        <a href="{{ "medical-records/" | absURL }}" style="color:#fff; font-size:14px; text-decoration:underline;">
            Medical Records &amp; Patient Portal Instructions
        </a>
    </div>
    <div class="footer-copyright">
        <div class="container-fluid">
            © {{ now.Year }} Copyright: {{ .Site.Title }}
        </div>
    </div>
</footer>
